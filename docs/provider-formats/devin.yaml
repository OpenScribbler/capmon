        content_hash: "sha256:443a3a07c20bc8405c22adeed5185a2b6816eeab6f6b042fe59e044e42958c96"
        fetched_at: "2026-09-30T07:54:17Z"
      - uri: "https://docs.devin.ai/cli/extensibility/hooks/lifecycle-hooks.md"
        type: documentation
        fetch_method: md_url
        content_hash: "sha256:8560c079c11294751910883263a2b5e6a30a68d60a785280cece7a8aa26832df"
        fetched_at: "2026-09-30T07:54:17Z"
    canonical_mappings:
      handler_types:
        status: mapped
        mechanism: "type \"command\" runs a shell command; type \"prompt\" evaluates an LLM prompt"
        confidence: confirmed
      matcher_patterns:
        status: mapped
        mechanism: "matcher is a regex matched against the event tool_name; empty or omitted matches every tool"
        confidence: confirmed
      decision_control:
        status: mapped
        mechanism: "top-level decision \"approve\" or \"block\" with optional reason; exit code 2 blocks the action"
        confidence: confirmed
      input_modification:
        status: mapped
        mechanism: "PreToolUse hooks return hookSpecificOutput.updatedInput, merged into the tool arguments before execution"
        confidence: confirmed
      async_execution:
        status: absent
        mechanism: "No async or background handler option documented for Devin lifecycle hooks"
        confidence: inferred
      hook_scopes:
        status: mapped
        mechanism: "project scope (.devin/hooks.v1.json, .devin/config.json, .devin/config.local.json, plus .claude/settings.json and .claude/settings.local.json) and user scope (~/.config/devin/config.json, Windows %APPDATA%\\devin\\config.json, plus ~/.claude.json and ~/.claude/settings.json)"
        confidence: confirmed
      json_io_protocol:
        status: mapped
        mechanism: "event data passed as JSON on stdin; hooks return JSON on stdout"
        confidence: confirmed
      context_injection:
        status: mapped
        mechanism: "hookSpecificOutput.additionalContext injects text into the agent context; documented for UserPromptSubmit and SessionStart"
        confidence: confirmed
      permission_control:
        status: mapped
        mechanism: "PermissionRequest event fires when a permission decision is needed; a hook can approve or block it"
        confidence: confirmed
    provider_extensions:
      - id: claude_code_hook_import
        name: Reads Claude Code hook settings
        summary: "Hooks declared in .claude/settings.json, .claude/settings.local.json, ~/.claude.json, and ~/.claude/settings.json are loaded alongside the Devin config files."
        source_ref: "https://docs.devin.ai/cli/extensibility/hooks/overview.md#where-hooks-live"
        graduation_candidate: false
        conversion: translated
      - id: post_compaction_event
        name: PostCompaction lifecycle event
        summary: "A PostCompaction event fires after the conversation context is compacted."
        source_ref: "https://docs.devin.ai/cli/extensibility/hooks/lifecycle-hooks.md#postcompaction"
        graduation_candidate: false
        provider_field: "PostCompaction"
        conversion: not-portable
    loading_model: >
      Hooks are not loaded into the model context. They run at agent lifecycle events
      (PreToolUse, PostToolUse, PermissionRequest, UserPromptSubmit, Stop, PostCompaction,
      SessionStart, SessionEnd). A command hook receives the event as JSON on stdin and answers
      with JSON on stdout or an exit code; additionalContext output is the only path into the
      model context.
    notes: >
      These are the Devin CLI lifecycle hooks, which Devin Local (the default Devin Desktop agent)
      runs on (https://docs.devin.ai/desktop/devin-local). Event names are PascalCase and the
      config shape matches Claude Code: a hooks object keyed by event, each entry holding a
      matcher and a list of hooks with type, command or prompt, and an optional timeout.
      .devin/hooks.v1.json holds a bare hooks object; the config.json files nest it under hooks.
      The legacy Cascade agent keeps its own snake_case hooks (pre_run_command, post_write_code,
      and others) in ~/.codeium/windsurf/hooks.json and .windsurf/hooks.json, documented at
      https://docs.devin.ai/desktop/cascade/hooks.md. That surface applies only to Cascade and is
      not the tracked source.

  mcp:
    status: supported
    sources:
      - uri: "https://docs.devin.ai/desktop/cascade/mcp.md"
        type: documentation
        fetch_method: http
        content_hash: "sha256:13b07d2f304dc2324405155b97a498a0c8ac2ebeeb41866b52c87ce4ab341129"
        fetched_at: "2026-09-30T07:54:21Z"
    canonical_mappings:
      transport_types:
        status: mapped
        mechanism: "three_transport_types: Devin Desktop supports stdio, SSE, and HTTP/streamable-HTTP transports"
        confidence: confirmed
      oauth_support:
        status: mapped
        mechanism: "Devin Desktop supports OAuth for each transport type (stdio, Streamable HTTP, and SSE) for remote MCP server authentication"
        confidence: confirmed
      env_var_expansion:
        status: mapped
        mechanism: "config_interpolation: Devin Desktop MCP configuration supports ${env:VAR_NAME} and ${file:/path} interpolation for environment variables and file contents"
        confidence: confirmed
      tool_filtering:
        status: mapped
        mechanism: "tool_limit_100: individual MCP tools can be toggled on or off per server via the Cascade panel UI; disabled tools are tracked in a disabledTools array separate from whitelist matching"
        confidence: confirmed
      auto_approve:
        status: absent
        mechanism: "Devin Desktop does not support pre-configured auto-approval for specific MCP tools"
        confidence: inferred
      marketplace:
        status: mapped
        mechanism: "mcp_marketplace: Devin Desktop has an in-IDE MCP server discovery and one-click installation experience"
        confidence: confirmed
      resource_referencing:
        status: absent
        mechanism: "Devin Desktop does not document @-mention or equivalent access to MCP resources"
        confidence: inferred
      enterprise_management:
        status: mapped
        mechanism: "enterprise_whitelist_and_registry: Devin Desktop supports organization-level MCP server allowlists and enterprise registries"
        confidence: confirmed
    provider_extensions:
      - id: three_transport_types
        name: "Three transport types: stdio, Streamable HTTP, SSE"
        summary: "MCP servers can use stdio, Streamable HTTP, or SSE transports; remote servers use `serverUrl`/`url` fields instead of `command`/`args`."
        source_ref: "https://docs.devin.ai/desktop/cascade/mcp.md"
        graduation_candidate: true
        conversion: translated
      - id: config_interpolation
        name: Variable interpolation in mcp_config.json
        summary: "Config fields support `${env:VAR_NAME}` and `${file:/path}` interpolation to inject env vars and file contents without hardcoding secrets."
        source_ref: "https://docs.devin.ai/desktop/cascade/mcp.md#config-interpolation"
        graduation_candidate: true
        conversion: embedded
      - id: tool_limit_100
        name: 100-tool cap across all MCP servers with per-tool toggle
        summary: "Cascade caps total MCP tools at 100 across all configured servers; individual tools can be toggled on or off via the Cascade panel UI to stay within the limit. Disabled tools are tracked in a disabledTools array and are excluded from admin whitelist matching."
        source_ref: "https://docs.devin.ai/desktop/cascade/mcp.md#configuring-mcp-tools"
        graduation_candidate: false
        conversion: not-portable
      - id: enterprise_whitelist_and_registry
        name: Enterprise MCP whitelist and custom registry
        summary: "Team admins can whitelist approved MCP servers (regex matching) and replace the default marketplace with custom MCP registry URLs. Multiple registry URLs are supported; Devin Desktop takes the union of all registries."
        source_ref: "https://docs.devin.ai/desktop/cascade/mcp.md#admin-controls-teams-enterprises"
        graduation_candidate: false
        conversion: not-portable
      - id: mcp_marketplace
        name: In-IDE MCP marketplace with deeplink install
        summary: "Built-in MCP marketplace accessible from the Cascade panel for one-click discovery and installation; supports deeplink format windsurf://windsurf-mcp-registry?serverName=<name> for direct server page navigation."
        source_ref: "https://docs.devin.ai/desktop/cascade/mcp.md"
        graduation_candidate: false
        conversion: not-portable
      - id: oauth_per_transport
        name: OAuth support for all transport types
        summary: "Devin Desktop supports OAuth authentication for MCP servers across all three transport types (stdio, Streamable HTTP, SSE), enabling authenticated remote server connections."
        source_ref: "https://docs.devin.ai/desktop/cascade/mcp.md"
        graduation_candidate: true
        conversion: translated
    loading_model: >
      MCP servers are configured in ~/.codeium/windsurf/mcp_config.json (global user config)
      using a `mcpServers` key. Each entry is a server definition with transport-specific fields:
      stdio servers use `command` + `args` + optional `env`; HTTP servers use `serverUrl` or `url`
      + optional `headers`. Configuration is read at IDE startup. Individual tools within each
      server can be toggled via the UI; disabled tools are tracked separately and not part of
      whitelist matching. MCP configuration is not part of the model context directly — the
      configured tools become available to Cascade as callable tools. OAuth is supported for
      all transport types for remote server authentication.
    notes: >
      Devin Desktop's MCP config format uses the mcpServers key (matches Claude Desktop / standard
      MCP config schema). The config file lives at ~/.codeium/windsurf/mcp_config.json.
      Devin Desktop supports tools, resources, and prompts from MCP servers. Enterprise users must
      manually enable MCP via settings. OAuth is now confirmed for all transport types. The
      disabledTools array (referenced in admin docs) tracks which tools are toggled off and is
      handled separately from server whitelist matching. Custom registries must follow the official
      MCP registry schema; when multiple registries are configured, Devin Desktop takes the union of
      all sources. The provider does not assume liability for MCP tool call failures since tool
      implementations are written by arbitrary server authors.

