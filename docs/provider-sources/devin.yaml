# Devin Desktop (formerly Windsurf) — Provider Source Manifest
# Docs-only: no public repo. Good llms.txt index with raw markdown URLs via Mintlify.
# Rebrand: "On June 2, 2026, Windsurf is becoming Devin Desktop."
# (https://docs.devin.ai/desktop/devin-desktop-faq). The slug changed from
# `windsurf` to `devin` at the v2 feed major (ADR-0013 tier 3, ADR-0015); the
# frozen v1 tree keeps serving v1/capabilities/windsurf.json.
# Devin Local, which shares the Devin CLI harness, is now the primary local
# agent; Cascade stays available as a legacy agent. Hooks and custom subagents
# are sourced from the CLI extensibility docs, which document the harness Devin
# Local runs on (https://docs.devin.ai/desktop/devin-local).

schema_version: "1"
last_verified: "2026-09-30"

slug: devin
display_name: Devin Desktop # formerly Windsurf
vendor: Cognition
status: active
fetch_tier: llms-txt
# No useful public repo (codeiumdev/windsurf is an empty POC).

change_detection:
  method: source-hash
  endpoint: https://docs.devin.ai/llms.txt
  # method: source-hash — per-source baselines in docs/provider-formats/devin.yaml

content_types:

  # ── Support summary ───────────────────────────────────────────────────
  # Devin Desktop supports: rules (.devin/rules/ + AGENTS.md, legacy
  #   .windsurf/rules/ and .windsurfrules), skills, hooks (Devin CLI lifecycle
  #   hooks), mcp, agents (custom subagents, experimental), and commands
  #   (Cascade Workflows; Devin Local does not support Workflows).
  # ─────────────────────────────────────────────────────────────────────

  rules:
    sources:
      - url: https://docs.devin.ai/desktop/cascade/memories.md
        type: docs
        format: markdown
        extracts: [file_format, file_locations, features]

      - url: https://docs.devin.ai/desktop/cascade/agents-md.md
        type: docs
        format: markdown
        extracts: [file_format, features]
    # Format: .devin/rules/*.md preferred, .windsurf/rules/*.md legacy fallback
    # (legacy .windsurfrules still read) + Cascade memories system. Also reads AGENTS.md.

  hooks:
    sources:
      - url: https://docs.devin.ai/cli/extensibility/hooks/overview.md
        type: docs
        format: markdown
        extracts: [event_names, hook_config_fields, config_examples]

      - url: https://docs.devin.ai/cli/extensibility/hooks/lifecycle-hooks.md
        type: docs
        format: markdown
        extracts: [event_names, hook_config_fields, config_examples]
    # Devin CLI / Devin Local lifecycle hooks: PascalCase events (PreToolUse,
    # PostToolUse, PermissionRequest, UserPromptSubmit, Stop, PostCompaction,
    # SessionStart, SessionEnd), command and prompt handlers, regex matcher on
    # tool_name, JSON on stdin. Config in .devin/hooks.v1.json, .devin/config.json,
    # ~/.config/devin/config.json; .claude/settings.json hooks are also read.
    # Legacy Cascade hooks (snake_case events in ~/.codeium/windsurf/hooks.json
    # and .windsurf/hooks.json, https://docs.devin.ai/desktop/cascade/hooks.md)
    # apply only to the Cascade agent and are not the tracked source.

  mcp:
    sources:
      - url: https://docs.devin.ai/desktop/cascade/mcp.md
        type: docs
        format: markdown
        extracts: [server_config_fields, transport_types, config_examples]

  skills:
    sources:
      - url: https://docs.devin.ai/desktop/cascade/skills.md
        type: docs
        format: markdown
        extracts: [file_format, features]

  agents:
    sources:
      - url: https://docs.devin.ai/cli/subagents.md
        type: docs
        format: markdown
        extracts: [file_format, file_locations, features]
    # Custom subagents (experimental): Markdown profiles with YAML frontmatter
    # (name, description, model, allowed-tools, max-nesting) under
    # .devin/agents/, .agents/agents/, ~/.config/devin/agents/ (Windows:
    # %APPDATA%\devin\agents\), as agents/<name>.md or agents/<name>/AGENT.md.

  commands:
    sources:
      - url: https://docs.devin.ai/desktop/cascade/workflows.md
        type: docs
        format: markdown
        extracts: [file_format, file_locations, features]
    # Format: plain Markdown files under .devin/workflows/ or .windsurf/workflows/
    # (project) and ~/.codeium/windsurf/global_workflows/ (global). Filename
    # drives slash-command identifier; 12,000-character per-file cap; manual
    # invocation only. Cascade-only: Devin Local does not support Workflows
    # (https://docs.devin.ai/desktop/devin-local).
